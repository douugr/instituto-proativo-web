name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar HTML
        run: npx --yes html-validate@9 "site/**/*.html"

      - name: Verificar links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress "site/**/*.html"
          fail: true

      - name: Garantir que não há cotas de patrocínio (FR-019)
        run: |
          if grep -RniE "\b(bronze|prata|ouro|master)\b|R\\$ ?(500|1\.000|2\.000)" site; then
            echo "::error::Menção a cotas de patrocínio encontrada em site/"
            exit 1
          fi
          echo "OK: sem cotas"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
